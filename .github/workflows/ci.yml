name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: web-ext-artifacts/*.zip

  integration:
    name: Firefox integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - run: sudo apt-get update && sudo apt-get install -y zip curl
      - run: npm ci
      - run: python -m pip install -r test/integration/requirements.txt
      - run: firefox --version
      - run: npm run test:integration
